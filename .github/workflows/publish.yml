name: Publish Release

on:
  release:
    types: [published]

env:
  # Define the primary Node.js version for release, build, coverage uploads and badge generation
  PRIMARY_NODE_VERSION: '26'

jobs:
  doc:
    name: Generate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/doc
        if: false
        with:
          default-runtime-version: ${{ env.PRIMARY_NODE_VERSION }}

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/coverage
        if: false
        with:
          default-runtime-version: ${{ env.PRIMARY_NODE_VERSION }}
          codecov-secret: ${{ secrets.CODECOV_TOKEN || 'Please define a CODECOV_TOKEN in your GitHub envVars' }}

  publish:
    name: Publish release to NPM
    runs-on: ubuntu-latest
    needs: [ doc, coverage ]
    environment: main
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up runtime - Node.js ${{  env.PRIMARY_NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate OpenAPI client
        run: npm run spec:generate

      - name: Build project
        run: npm run build

      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Publish package
        if: success()
        run: npm publish

